[project]
name = "pyforger"
version = "0.0.2"
authors = [
  { name="Vijay Viswanathan", email="vcomeinpeace@gmail.com" },
]
description = "A small example package"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]
dependencies = ["arxiv>=2.0", "requests>=2.20", "datasets"]

[project.urls]
Homepage = "https://github.com/viswavi/forger"
Issues = "https://github.com/viswavi/forger/issues"

[build-system]
requires = ["uv_build >= 0.9.8, <0.10.0"]
build-backend = "uv_build"

[tool.hatch.build]
include = [
    "*.py",
]
exclude = [
    "*_test.py",
    "test_*.py",
]
only-packages = true

[project.optional-dependencies]
test = [
    "pytest>=6.0.0",
]
dev = [
    "pytest",
    "pre-commit"
]

[tool.hatch.build.targets.wheel]
packages = ["forger"]

[tool.pytest.ini_options]
pythonpath = ["src", "test_helpers"]
testpaths = ["tests"]
