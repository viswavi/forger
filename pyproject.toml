[project]
name = "pyforger"
version = "0.0.3"
authors = [
  { name="Vijay Viswanathan", email="vcomeinpeace@gmail.com" },
]
description = "A small example package"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "rouge-score",
    "arxiv>=2.0",
    "requests>=2.20",
    "trafilatura>=1.6",
    "datasets",
    "huggingface_hub",
    "semanticscholar>=0.11.0",
    "litellm>=1.93.0,<2",
    "tiktoken",
    "RestrictedPython>=8.4",
    "openhands-sdk @ git+https://github.com/neubig/software-agent-sdk.git@82327f93b4d02518a08c720f0111fa4aa13fce41#subdirectory=openhands-sdk",
    "openhands-tools @ git+https://github.com/neubig/software-agent-sdk.git@82327f93b4d02518a08c720f0111fa4aa13fce41#subdirectory=openhands-tools",
    "pypdf>=5,<7",
    "urllib3>=2,<3",
    "pydantic>=2,<3",
    "python-dotenv",
    "tqdm",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/viswavi/forger"
Issues = "https://github.com/viswavi/forger/issues"

[build-system]
requires = ["uv_build >= 0.9.8, <0.10.0"]
build-backend = "uv_build"

[tool.hatch.build]
include = [
    "*.py",
]
exclude = [
    "*_test.py",
    "test_*.py",
]
only-packages = true

[project.optional-dependencies]
sail = ["sail>=0.14,<0.15"]
# Native separate verifier environments require Harbor 0.25 or newer.
harbor = [
    "harbor[modal,sail]>=0.25.0,<0.26 ; python_version >= '3.12'",
]
# Topic-Based Clustering requires K-means clustering and on-device embedding creation.
clustering = [
    "numpy",
    "scikit-learn",
    "sentence-transformers>=5.6.0",
]
test = [
    "pytest>=6.0.0",
    "mypy==2.4.0",
    "pyyaml",
    "jsonschema",
    "numpy",
    "scikit-learn",
]
dev = [
    "pytest",
    "pre-commit",
    "pyyaml",
    "jsonschema",
    "types-pyyaml",
]
validation = [
    "pyyaml",
    "jsonschema",
]
# LocalModel requires on-GPU inference.
vllm = [
    "vllm>=0.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["forger"]

[tool.pytest.ini_options]
pythonpath = ["src", "test_helpers"]
testpaths = ["tests"]

[tool.isort]
profile = "black"
known_first_party = ["pyforger"]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_defs = true
check_untyped_defs = true
files = ["src/pyforger"]
ignore_missing_imports = true
