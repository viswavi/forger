[project]
name = "pyforger"
version = "0.0.3"
authors = [
  { name="Vijay Viswanathan", email="vcomeinpeace@gmail.com" },
]
description = "A small example package"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "rouge-score",
    "arxiv>=2.0",
    "requests>=2.20",
    "trafilatura>=1.6",
    "datasets",
    "huggingface_hub",
    "semanticscholar>=0.11.0",
    "litellm==1.83.0",
    "tiktoken",
    "RestrictedPython>=7.0",
    "python-dotenv",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/viswavi/forger"
Issues = "https://github.com/viswavi/forger/issues"

[build-system]
requires = ["uv_build >= 0.9.8, <0.10.0"]
build-backend = "uv_build"

[tool.hatch.build]
include = [
    "*.py",
]
exclude = [
    "*_test.py",
    "test_*.py",
]
only-packages = true

[project.optional-dependencies]
# Topic-Based Clustering requires K-means clustering and on-device embedding creation.
clustering = [
    "numpy",
    "scikit-learn",
    "sentence-transformers>=5.6.0",
]
test = [
    "pytest>=6.0.0",
    "pyyaml",
    "jsonschema",
    "numpy",
    "scikit-learn",
]
dev = [
    "pytest",
    "pre-commit",
    "pyyaml",
    "jsonschema",
    "types-pyyaml",
]
validation = [
    "pyyaml",
    "jsonschema",
]
# LocalModel requires on-GPU inference.
vllm = [
    "vllm>=0.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["forger"]

[tool.pytest.ini_options]
pythonpath = ["src", "test_helpers"]
testpaths = ["tests"]
