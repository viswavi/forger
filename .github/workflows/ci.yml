name: Continuous Integration
on:
  push:
    branches:
      - main
  pull_request:
    branches: ["**"]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ '3.12', '3.13' ]
    steps:
      - uses: actions/checkout@v3
      - name: Install Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]"
      - name: test
        run: pytest
  dynamic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'
      - name: Install dynamic dependencies
        run: pip install ".[test,dynamic]"
      - name: Test dynamic operations
        run: pytest tests/test_alter_dynamic.py tests/test_alter_dynamic_resources.py
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: format
        uses: pre-commit/action@v3.0.0
        with:
          extra_args: black --all-files
  isort:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: isort
        uses: pre-commit/action@v3.0.0
        with:
          extra_args: isort --all-files
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: lint
        uses: pre-commit/action@v3.0.0
        with:
          extra_args: flake8 --all-files
      - name: lint-pep585-compliant
        uses: pre-commit/action@v3.0.0
        with:
          extra_args: upgrade-type-hints --all-files
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: mypy
        uses: pre-commit/action@v3.0.0
        with:
          extra_args: mypy --all-files
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Node
        uses: actions/setup-node@v3
        with:
          node-version: 18.x
      - name: lint
        uses: pre-commit/action@v3.0.0
        with:
          extra_args: markdownlint-cli2 --all-files
